[package]
name = "egui_accesskit_web"
description = "egui in a browser, for screen readers: an egui plugin giving eframe web apps an AccessKit adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["egui", "accessibility", "accesskit", "a11y", "web"]
categories = ["accessibility", "gui", "wasm"]

[dependencies]
accesskit_web.workspace = true
egui.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
] }

[lints]
workspace = true
